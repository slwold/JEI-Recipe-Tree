tasks.named('check') {
    dependsOn 'testRecipeTreeMaterials', 'testJeiInputBridge', 'testCoreItemRef', 'testCoreAmounts', 'testJeiCapabilities', 'testItemRefKeyParity', 'testStorageDrivers', 'testCraftQueue', 'testTransferPhase', 'testViewportFit', 'testStaleConfigKeys', 'testComplexityBudget', 'testCostCalculator', 'testCraftStepOrder', 'testCostCalculatorOracle', 'testRecipeLibrary'
}
tasks.named('test') { enabled = false }

apply from: 'gradle/client-sources.gradle'
apply from: 'gradle/verify-jei.gradle'
apply from: 'gradle/verify-core.gradle'
apply from: 'gradle/verify-identity.gradle'
apply from: 'gradle/verify-storage.gradle'
apply from: 'gradle/verify-transfer.gradle'
apply from: 'gradle/verify-render.gradle'
apply from: 'gradle/verify-ui.gradle'
apply from: 'gradle/verify-observability.gradle'
apply from: 'gradle/verify-config.gradle'
apply from: 'gradle/verify-docs.gradle'
apply from: 'gradle/verify-scan-gating.gradle'
apply from: 'gradle/verify-library.gradle'
apply from: 'gradle/verify-client-packages.gradle'
apply from: 'gradle/compare-traces.gradle'
tasks.named('check') {
    dependsOn 'verifyJeiCompatibility'
    dependsOn 'verifyOwnMixins'
    dependsOn 'verifyMinecraftMixinTargets'
    dependsOn 'verifyRemovedFeatures'
    dependsOn 'verifyCoreIsolation'
    dependsOn 'verifyCapabilityParity'
    dependsOn 'verifyIdentityLayer'
    dependsOn 'verifyStorageDrivers'
    dependsOn 'verifyTransferQueue'
    dependsOn 'verifyStartupDiagnostics'
    dependsOn 'testConfigBlocks'
    dependsOn 'verifyConfigSafety'
    dependsOn 'verifyConfigPathSource'
    dependsOn 'verifyDocCounts'
    dependsOn 'verifyTransferObservability'
    dependsOn 'verifyRenderLayers'
    dependsOn 'verifyTreeLayout'
    dependsOn 'verifySlotClassification'
    dependsOn 'verifyScanGating'
    dependsOn 'verifyLibrarySource'
    dependsOn 'verifyViewportFit'
    dependsOn 'verifyUiLayers'
    dependsOn 'verifySessionMigration'
    dependsOn 'verifyClientPackages'
}

tasks.register('testConfigBlocks', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.output + sourceSets.main.output + sourceSets.main.compileClasspath + files(mcJar)
    mainClass = 'com.slwold.jeirecipetree.ConfigBlocksTest'
}
