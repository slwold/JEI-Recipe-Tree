plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '1.0.24'
}

version = "${minecraft_version}-${mod_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version
}

sourceSets {
    core {
        java { srcDir 'src/core/java' }
    }
}

dependencies {
    implementation sourceSets.core.output
}

tasks.named('jar') {
    from sourceSets.core.output
}

repositories {
    mavenCentral()
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
}

dependencies {
    compileOnly "mezz.jei:jei-1.21.1-neoforge:${jei_compile_version}"
    compileOnly files('libs/appliedenergistics2-19.2.18.jar')
    testImplementation "mezz.jei:jei-1.21.1-neoforge:${jei_compile_version}"
    testImplementation 'com.electronwill.night-config:core:3.8.0'
    testImplementation 'com.electronwill.night-config:toml:3.8.0'
}

configurations {
    jeiModel {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    jeiModel "mezz.jei:jei-1.21.1-neoforge:${jei_version}"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        minecraft_version     : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version           : neo_version,
        neo_version_range     : neo_version_range,
        jei_version           : jei_version,
        jei_version_range     : jei_version_range,
        loader_version_range  : loader_version_range,
        mod_id                : mod_id,
        mod_name              : mod_name,
        mod_license           : mod_license,
        mod_version           : mod_version,
        mod_authors           : mod_authors,
        mod_credits           : mod_credits
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

def mcJar = layout.buildDirectory.file('moddev/artifacts/neoforge-21.1.80-minecraft.jar')

tasks.register('testRecipeTreeMaterials', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.slwold.jeirecipetree.client.data.RecipeTreeOutputChoicesTest'
}
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath

tasks.register('testJeiInputBridge', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath + files(mcJar)
    mainClass = 'com.slwold.jeirecipetree.client.jei.JeiInputBridgeTest'
}

