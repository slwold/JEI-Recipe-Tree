// B5/B6 结构机检：界面层、树行模型、会话持久化、mixin 门面的边界不许回潮。
//
// 这些边界一旦破掉，症状都极隐蔽：
//   - mixin 直连实现类 → 1.20.1 移植时二十几个 mixin 全要改指向；
//   - 布局常量散回屏幕类 → 改渲染顺序会顺手碰坐标；
//   - 树行逻辑回到动态代理 → 代理抛异常时栈里全是 java.lang.reflect，定位不到逻辑行；
//   - 会话 JSON 写回会话类 → 存档字段名不再是可审计的一处契约（R4 风险）。

tasks.register('verifyUiLayers') {
    doLast {
        def mixinDir = 'src/main/java/com/slwold/jeirecipetree/mixin/'
        def screen = clientSource('RecipeTreeScreen.java')
        def favorites = clientSource('RecipeTreeFavorites.java')
        def session = clientSource('RecipeTreeSession.java')
        def layout = clientSource('TreeLayout.java')
        def row = clientSource('TreeRow.java')
        def persistence = clientSource('SessionPersistence.java')
        def facade = clientSource('JeiTreeIntegration.java')
        [screen, favorites, session, layout, row, persistence, facade].each {
            assert it.exists() : "missing ${it}"
        }

        // 1) mixin 只允许通过门面调用实现类
        def direct = []
        file(mixinDir).listFiles().findAll { it.name.endsWith('.java') }.each { file ->
            def text = file.getText('UTF-8')
            ['RecipeTreeFavorites.', 'RecipeTreeSession.', 'RecipeTreeScreen.'].each { token ->
                if (text.contains(token)) {
                    direct << "${file.name}: ${token}"
                }
            }
        }
        assert direct.isEmpty() : "mixin must go through JeiTreeIntegration, direct calls found: ${direct}"
        assert facade.getText('UTF-8').contains('public final class JeiTreeIntegration') :
            'the mixin facade must exist'

        // 2) 布局常量归 TreeLayout，屏幕类不许再声明
        def layoutText = layout.getText('UTF-8')
        def screenText = screen.getText('UTF-8')
        ['RECIPE_NODE_WIDTH', 'LEAF_NODE_WIDTH', 'NODE_HEIGHT', 'X_PITCH', 'Y_SPACING',
         'COST_SPACING', 'MODE_BUTTON_SIZE', 'MODE_BUTTON_HIT', 'TRANSFER_BUTTON_SIZE'].each { name ->
            assert layoutText.contains("int ${name} =") : "TreeLayout must own ${name}"
            assert !(screenText =~ /private static final int ${name} =/).find() :
                "${name} must not be redeclared in RecipeTreeScreen"
        }
        assert screenText.contains('private final TreeLayout layout = new TreeLayout();') :
            'the screen must delegate layout to TreeLayout'

        // 2b) 树界面必须唯一：每次 new 一个会让几棵树各带一份 layout/缩放互相覆盖
        assert screenText.contains('private static RecipeTreeScreen instance') :
            'the tree screen must be a singleton: stacked instances draw several trees on top of each other'
        assert screenText.contains('minecraft.screen instanceof RecipeTreeScreen') :
            'openCurrent() must detect an already-open tree screen instead of stacking a second one'
        assert screenText.count('new RecipeTreeScreen(') <= 1 :
            'openCurrent() must not construct a screen per call (exactly one construction site: the singleton factory)'

        // 3) 树行逻辑在 TreeRow，代理只做转发
        def rowText = row.getText('UTF-8')
        assert rowText.contains('public final class TreeRow') : 'the explicit row model must exist'
        assert rowText.contains('public long owned()') && rowText.contains('public long total()') :
            'the row model must own the amount computations'
        def favoritesText = favorites.getText('UTF-8')
        assert favoritesText.contains('private final TreeRow row;') :
            'the proxy must delegate to TreeRow'
        assert !(favoritesText =~ /private final ITypedIngredient<\?> typed;/).find() :
            'the proxy must not keep its own copy of the row data'

        // 4) 会话持久化归 SessionPersistence，格式字段名冻结
        def sessionText = session.getText('UTF-8')
        def persistenceText = persistence.getText('UTF-8')
        assert !sessionText.contains('new GsonBuilder') :
            'JSON writing must live in SessionPersistence'
        ['crafting', 'recipe', 'category', 'registry', 'output', 'count', 'batches', 'item'].each { field ->
            // 字段可能跨行书写（如 category），所以用正则而不是字面量
            assert (persistenceText =~ /addProperty\(\s*"${field}"/).find() :
                "session field ${field} must be written in SessionPersistence"
        }
        assert persistenceText.contains('public static final String FILE_NAME = "recipe_tree_session.json"') :
            'the session file name is a frozen contract'

        println('UI layer checks passed: mixin facade only, layout constants in TreeLayout, '
            + 'row model owns computations, session format frozen in SessionPersistence')
    }
}

// 配置目录必须只落在自己的 modId 下，且**不得**去别的目录名里读或改文件：
// 读别人的 config 子目录、甚至把里面的文件改名，等于跟装了同名模组的玩家抢文件。
tasks.register('verifySessionMigration') {
    doLast {
        def sources = ['SessionPersistence.java', 'RecipeTreeDefaults.java']
            .collect { clientSource(it).getText('UTF-8') }
        sources.each { text ->
            assert text.contains('"jeirecipetree"') :
                'config paths must resolve under the modId directory'
            assert !(text =~ /"jeicrt"|"ject"/) :
                'no config directory other than the modId may be touched'
        }
        println 'Config path checks passed: single modId directory, no foreign config dirs'
    }
}
