// 客户端源码按“文件名”解析。
//
// 背景：2026-11-26 起 client 包按职责拆成 client.ui / client.data / client.transfer /
// client.storage / client.jei。12 个 verify 脚本原先各自硬编码
// `src/main/java/com/slwold/jeirecipetree/client/Xxx.java`（共 21 处），搬一个文件就要
// 改十来个脚本，真实语义失败会被一堆“file not exists”噪音盖住。
//
// 这里只提供解析器：路径由文件名推出来，语义断言（类名、字段、数量）一个字不动。
// 注意：本脚本**不许注册任何 verify 任务**——`verifyDocCounts` 按 gradle 脚本里注册的
// 任务名数量核对文档，多注册一个就会让机检计数与实际不符。

ext.clientSource = { String name ->
    def hits = fileTree('src/main/java/com/slwold/jeirecipetree/client') {
        include "**/$name"
    }.files as List
    assert hits.size() == 1 :
        "client source '${name}' resolved to ${hits.size()} file(s): ${hits*.path}"
    return hits.first()
}
