tasks.register('verifyRenderLayers') {
    doLast {
        def layers = file('src/main/java/com/slwold/jeirecipetree/client/RenderLayers.java')
        assert layers.exists() : 'RenderLayers must remain the single source of z-order truth'
        def text = layers.getText('UTF-8')

        def number = { String name ->
            def matcher = (text =~ /(?m)public static final int ${name} = (\d+);/)
            assert matcher.find() : "missing layer constant ${name}"
            return matcher.group(1) as int
        }
        def ordered = ['SLOT_HIGHLIGHT', 'BADGE_MIN', 'OVERLAY_BADGE', 'AMOUNT_BADGE',
                       'BADGE_MAX', 'PLUS_MARKER', 'SELECTION_PANEL', 'ROUTE', 'TOOLTIP']
        def values = ordered.collect { number(it) }
        assert values[0] < values[1] : 'slot highlight must sit below badges'
        assert values[1] < values[2] && values[2] < values[3] : 'badge layers must ascend'
        assert values[3] <= values[4] : 'amount badge must be inside the badge range'
        assert values[4] < values[5] && values[5] < values[6] : 'plus marker and selection panel order'
        assert values[6] < values[7] && values[7] < values[8] : 'route and tooltip order'
        assert number('TOOLTIP') == 800 :
            'ModernUI self-draws its tooltip below 300; JERT tooltips must stay at z=800'

        def icon = number('ICON')
        assert icon > number('SLOT_HIGHLIGHT') :
            'the container slot tint must stay below the item icon'
        def aboveIcon = ['SLOT_OVERLAY', 'SLOT_AMOUNT', 'PANEL_MENU', 'PANEL_HAND',
                         'BADGE_MAX', 'PLUS_MARKER', 'SELECTION_PANEL']
        def aboveValues = aboveIcon.collect { number(it) }
        aboveValues.eachWithIndex { value, index ->
            assert value > icon : "${aboveIcon[index]}=${value} must be above ICON=${icon}, or the item icon covers it"
        }
        (0..(aboveValues.size() - 2)).each { index ->
            assert aboveValues[index] < aboveValues[index + 1] :
                "${aboveIcon[index]} must stay below ${aboveIcon[index + 1]}"
        }
        assert number('PANEL_HAND') < number('TOOLTIP') : 'the hand label must stay below tooltips'

        def uiFiles = ['RecipeTreeScreen.java', 'RecipeTreeSidebarPanel.java',
                       'StorageNetworkIntegration.java', 'AmountOverlay.java',
                       'RecipeEditPanel.java', 'CandidatePicker.java',
                       'RecipeLibraryScreen.java', 'TreeGlyphs.java', 'SlotChrome.java',
                       'AmountText.java']
        def bare = []
        def scanDepth = { String label, String body ->
            (body =~ /(?m)pose\(\)\.translate\([^;]*?,\s*(\d+)\s*\);/).each { whole, z ->
                if ((z as int) != 0) {
                    bare << "${label}: z=${z}"
                }
            }
        }
        uiFiles.each { name ->
            def file = file('src/main/java/com/slwold/jeirecipetree/client/' + name)
            assert file.exists() : "missing ${name}"
            scanDepth(name, file.getText('UTF-8'))
        }
        def mixin = file('src/main/java/com/slwold/jeirecipetree/mixin/AbstractContainerScreenMixin.java')
        assert mixin.exists() : 'AbstractContainerScreenMixin must exist'
        scanDepth('AbstractContainerScreenMixin.java', mixin.getText('UTF-8'))
        assert bare.isEmpty() : "hardcoded render depth found: ${bare}"

        println('Render layer checks passed: 9 constants ascending, tooltip=800, '
            + 'every above-icon layer > ICON, no hardcoded z in UI files')
    }
}

tasks.register('verifyViewportFit') {
    doLast {
        def fit = file('src/core/java/com/slwold/jeirecipetree/core/ViewportFit.java')
        def screen = file('src/main/java/com/slwold/jeirecipetree/client/RecipeTreeScreen.java')
        def test = file('src/test/java/com/slwold/jeirecipetree/core/ViewportFitTest.java')
        [fit, screen, test].each { assert it.exists() : "missing ${it}" }

        def fitText = fit.getText('UTF-8')
        def screenText = screen.getText('UTF-8')
        assert fitText.contains('public static final float MIN_ZOOM = 0.10f') :
            'the zoom floor belongs to core/ViewportFit'
        assert fitText.contains('public static final float MAX_ZOOM = 1.0f') :
            'the zoom ceiling belongs to core/ViewportFit'
        assert screenText.contains('ViewportFit.fit(') :
            'the screen must delegate viewport fitting to core'

        def strays = []
        ['0.10f', 'contentPadding', 'availableWidth', 'availableHeight', 'contentWidth', 'contentHeight']
            .each { token ->
                if ((screenText =~ /\b${token}\b/).find()) {
                    strays << token
                }
            }
        assert strays.isEmpty() : "viewport constants leaked back into the screen: ${strays}"

        assert test.getText('UTF-8').contains('MIN_ZOOM') :
            'the zoom-floor scenario must stay asserted'

        println('Viewport fit checks passed: constants in core, screen delegates, zoom scenarios asserted')
    }
}

tasks.register('verifyTreeLayout') {
    doLast {
        def layout = file('src/main/java/com/slwold/jeirecipetree/client/TreeLayout.java')
        def screen = file('src/main/java/com/slwold/jeirecipetree/client/RecipeTreeScreen.java')
        [layout, screen].each { assert it.exists() : "missing ${it}" }
        def layoutText = layout.getText('UTF-8')
        def screenText = screen.getText('UTF-8')

        assert layoutText.contains('public static final int X_PITCH = RECIPE_NODE_WIDTH + COST_SPACING') :
            'sibling pitch must be "widest node + gap": a step narrower than a node always overlaps'
        assert !layoutText.contains('ToIntFunction') :
            'layout must not take a node-width function any more; fixed pitch is the point'

        def body = (layoutText =~ /(?s)private int layoutNode\(.*?\n    \}/)
        assert body.find() : 'layoutNode must still exist'
        def node = body.group(0)
        assert node.contains('X_PITCH') :
            'layoutNode must advance the cursor by X_PITCH'
        assert !node.contains('font.width') && !node.contains('widthFn') :
            'layoutNode must not measure text: measuring per node is what produced 59 vs 72'
        assert node.contains('cursor[0] += X_PITCH') :
            'the leaf cursor advances by the pitch, nothing else'

        assert screenText.contains('Math.min(TreeLayout.RECIPE_NODE_WIDTH, width)') :
            'nodeWidth must stay clamped to RECIPE_NODE_WIDTH, or a wide plate spills into the neighbour'

        println 'Tree layout checks passed: fixed X_PITCH, no text measuring in layoutNode, plate width clamped'
    }
}

tasks.register('verifySlotClassification') {
    doLast {
        def mixin = file('src/main/java/com/slwold/jeirecipetree/mixin/AbstractContainerScreenMixin.java')
        assert mixin.exists() : 'AbstractContainerScreenMixin must exist'
        def text = mixin.getText('UTF-8')
        def perKind = java.util.regex.Pattern
            .compile('JeiTreeIntegration\\.(isFinalProduct|isIntermediate|isRequired)\\(')
            .matcher(text)
        assert !perKind.find() : 'slot hooks must call classify() once, not three per-kind queries'
        assert text.contains('JeiTreeIntegration.classify(') :
            'the slot hooks must use the combined classify() query'
        def favorites = file('src/main/java/com/slwold/jeirecipetree/client/RecipeTreeFavorites.java')
        def favText = favorites.getText('UTF-8')
        assert favText.contains('public static int classify(ItemStack stack)') :
            'RecipeTreeFavorites.classify must exist'
        ['CLASS_FINAL', 'CLASS_INTERMEDIATE', 'CLASS_REQUIRED'].each { bit ->
            assert favText.contains(bit) : "missing classification bit ${bit}"
        }
        println 'Slot classification checks passed: single getUniqueId per slot, classify() wired, 3 bits present'
    }
}
