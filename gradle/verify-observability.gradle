// 可观测性机检：用构建期断言拦住三类问题回潮。
//
// 背景（都来自 26.3-Vanilla 的 latest.log / F9 快照）：
//   1. 启动行 `dev=unknown`，但 F9 里 `dev=true` —— 构造期读配置太早，启动自检说了假话；
//   2. 输入层先打 "event layer stands down"，又打 WARN "event layer handles clicks" —— 自相矛盾；
//   3. 转移状态机 22 个退出点全静默，卡住时日志突然断掉，无法回答卡在哪一步。

tasks.register('verifyStartupDiagnostics') {
    doLast {
        def jert = file('src/main/java/com/slwold/jeirecipetree/JERT.java')
        def readiness = file('src/main/java/com/slwold/jeirecipetree/JERTConfigReadiness.java')
        def sidebar = clientSource('RecipeTreeSidebarPanel.java')
        def logFacade = clientSource('JERTLog.java')
        [jert, readiness, sidebar, logFacade].each { assert it.exists() : "missing ${it}" }

        def jertText = jert.getText('UTF-8')
        assert jertText.contains('private static volatile String developerState = "pending"') :
            'startup summary must not pretend to know developerMode before configs load'
        assert jertText.contains('public static void markDeveloperMode(boolean enabled)') :
            'config readiness must be able to backfill the real developerMode'
        assert !jertText.contains('private static String developerMode()') :
            'the old constructor-time developerMode() fallback must not come back'

        def readyText = readiness.getText('UTF-8')
        assert readyText.contains('ModConfigEvent.Loading') : 'must listen on the config loading event'
        assert readyText.contains('ModConfig.Type.CLIENT') : 'must filter for the CLIENT config'
        assert readyText.contains('JERT.markDeveloperMode') : 'must backfill the startup summary state'

        def sidebarText = sidebar.getText('UTF-8')
        assert !(sidebarText =~ /(?m)^\s*JERTLog\.[a-zA-Z]+\([^\n]*event layer stands down/).find() :
            'the event layer never stands down on JEI 19.64+; do not reintroduce the misleading log line'
        assert !sidebarText.contains('JERTLog.warn("legacy input proxy is installed') :
            'JEI ignoring the legacy proxy is expected, not a degradation; use summary'
        assert sidebarText.contains('event layer stays armed') : 'keep the accurate wording'

        def logText = logFacade.getText('UTF-8')
        assert logText.contains('catch (RuntimeException ignored)') :
            'JERTLog.debug must tolerate config not being ready yet'

        println('Startup diagnostics checks passed: config backfill, accurate input-layer wording, debug guard')
    }
}

tasks.register('verifyTransferObservability') {
    doLast {
        def transfer = clientSource('RecipeTreeTransfer.java')
        def phase = file('src/core/java/com/slwold/jeirecipetree/core/TransferPhase.java')
        def test = file('src/test/java/com/slwold/jeirecipetree/core/TransferPhaseTest.java')
        [transfer, phase, test].each { assert it.exists() : "missing ${it}" }

        def text = transfer.getText('UTF-8')
        assert text.contains('com.slwold.jeirecipetree.core.TransferPhase') :
            'transfer state machine must expose a phase for logs and F9'
        assert text.contains('static void clearPending(String reason)') :
            'exit points must go through the reason-logging overload'

        // 退出点分散在同包多个文件（主类 + PickupTicks 等），按全 transfer 包合计。
        def allText = fileTree('src/main/java/com/slwold/jeirecipetree/client/transfer') {
            include '*.java'
        }.files.collect { it.getText('UTF-8') }.join('\n')
        def explained = (allText =~ /clearPending\("[^"]+"\);/).count
        def silent = (allText =~ /(?m)^\s*clearPending\(\);\s*$/).count
        assert explained >= 20 : "expected at least 20 explained exit points, found ${explained}"
        // 允许的无原因清理：cancel()、transfer() 开头、以及带原因重载内部的最终清理。
        assert silent <= 3 : "unexpected silent clears (expected at most 3), found ${silent}"

        assert phase.getText('UTF-8').contains('public static TransferPhase of(') :
            'phase classification must be a pure, testable function'
        assert test.getText('UTF-8').contains('oracle(') :
            'the tick() dispatch order must stay as a parity oracle'

        println("Transfer observability checks passed: ${explained} explained exits, ${silent} intentional silent clears, phase parity oracle present")
    }
}
