// mixin 注入点静态校验（ModDevGradle 版）
//
// 设计取舍：
// 1. 用 ASM 解析真实 JEI class 模型最理想，但逐个校验 @Shadow 描述符 / @Accessor 返回类型 /
//    @Inject 回调签名需要 asm-tree，本机 Gradle 缓存里没有可离线解析的副本，走 buildscript 会被
//    "--offline" 直接拒绝，因此改为**零依赖**实现：
//      - 目标类是否存在 → 查 JEI jar 的 zip 条目；
//      - 目标方法是否存在 → 在目标 class 的常量池字节里查方法名（ASCII，可直接字符串匹配）。
//    代价：不校验描述符与回调参数顺序，能力弱于上游；收益是离线可用、无额外依赖。
// 2. 上游断言过的 CreativeTabBar / CreativeTabGridCompat / JeiModalRenderMixin 等类已在精简中删除，
//    对应断言移除。
// 3. JEI 来源从上游的 localRuntime 改为专用 jeiModel 配置（MDG 无 localRuntime）。
// 自身 mixin 配置校验：条目格式与类文件存在性
//
// mixins.json 声明了 package 前缀时，条目必须只是类名；
// 写成全限定名会被 Mixin 再拼一次包前缀，导致 "was not found" 启动崩溃。
// 这里在构建期就把两种错误拦下：条目含包前缀、条目类文件不存在。
// Minecraft 侧注入点的描述符校验
//
// 典型错误：@Inject 回调的描述符写成
// (Minecraft, GuiGraphics, int, int, float, CallbackInfo)，而目标 render 的签名是
// (GuiGraphics, int, int, float) —— Mixin 在运行期抛 InvalidInjectionException 直接崩。
// 这里把「目标方法 + 期望描述符」列成清单，构建期就到 MC jar 的常量池里查描述符，
// 写错签名会在构建阶段失败，而不是启动时。
tasks.register('verifyMinecraftMixinTargets') {
    dependsOn 'classes'
    doLast {
        def mcJars = fileTree(dir: "${project.buildDir}/moddev/artifacts", include: '*-minecraft.jar')
                .files.findAll { !it.name.contains('merged') && !it.name.contains('sources') }
        def mcJar = mcJars.find { true }
        assert mcJar : "Minecraft artifact not found in ${project.buildDir}/moddev/artifacts"

        def classBytes = { String internalName ->
            new java.util.zip.ZipFile(mcJar).withCloseable { zip ->
                def entry = zip.getEntry(internalName + '.class')
                entry == null ? null : zip.getInputStream(entry).bytes
            }
        }

        def expectations = [
            ['net/minecraft/client/gui/screens/inventory/AbstractContainerScreen', 'render',
             '(Lnet/minecraft/client/gui/GuiGraphics;IIF)V'],
            ['net/minecraft/client/gui/screens/inventory/AbstractContainerScreen', 'mouseClicked',
             '(DDI)Z'],
            ['net/minecraft/client/gui/screens/inventory/AbstractContainerScreen', 'renderSlot',
             '(Lnet/minecraft/client/gui/GuiGraphics;Lnet/minecraft/world/inventory/Slot;)V']
        ]

        def problems = []
        expectations.each { entry ->
            def (internalName, method, descriptor) = entry
            def bytes = classBytes(internalName)
            if (bytes == null) {
                problems << "missing class ${internalName}"
                return
            }
            def text = new String(bytes, 'ISO-8859-1')
            if (!text.contains(descriptor)) {
                problems << "${internalName}#${method} has no descriptor ${descriptor}"
            }
            if (!text.contains(method)) {
                problems << "${internalName} has no method named ${method}"
            }
        }
        assert problems.isEmpty() : "Minecraft mixin target mismatch: ${problems}"
        println "Minecraft mixin target checks passed: ${expectations.size()} entries"
    }
}

/**
 * 已删除功能的回归闸门。
 *
 * 一次功能删除如果只删了一半（代码删了、配置/校验/文案还在），
 * 后面每一轮都会有人在半截状态上继续改，问题反复回归。这里把“已删除功能的关键标识”
 * 列成黑名单，源码里再出现就直接构建失败——删除动作必须彻底，且不许悄悄复活。
 */
tasks.register('verifyRemovedFeatures') {
    doLast {
        def banned = [
            'RecipeBookPage',           // 书页内容区注入点（已删除）
            'RecipeTreeBookContent',    // 书页替换的渲染/交互类（已删除）
            'replaceVanillaRecipeBook'  // 书页替换的配置项（已删除）
        ]
        def offenders = []
        fileTree('src/main/java').matching { include '**/*.java' }.each { source ->
            // 只扫**代码**：注释里提及被删除的特性是合理的（例如说明"旧配置里残留着
            // 某个已删除的键，模组会把它清掉"）。把注释也当违规会让正确的说明
            // 反而无法写出来。
            def text = stripComments(source.getText('UTF-8'))
            banned.each { token ->
                if (text.contains(token)) {
                    offenders << "${source.name} -> ${token}"
                }
            }
        }
        assert offenders.isEmpty() : "removed feature leaked back into source: ${offenders}"
        println "Removed-feature guard passed: ${banned.size()} tokens absent (code only)"
    }
}

tasks.register('verifyOwnMixins') {
    dependsOn 'classes'
    doLast {
        def configFile = file('src/main/resources/jeirecipetree.mixins.json')
        assert configFile.exists() : 'mixins config missing'
        def config = new groovy.json.JsonSlurper().parse(configFile, 'UTF-8')
        def pkg = config.package as String
        def all = []
        (config.client ?: []).each { all << it }
        (config.mixins ?: []).each { all << it }
        (config.server ?: []).each { all << it }

        def bad = all.findAll { it.contains('.') }
        assert bad.isEmpty() :
            "mixins.json declares package='${pkg}', so entries must be simple class names; offending: ${bad}"

        def outputDir = sourceSets.main.output.classesDirs.first()
        def missing = all.findAll { name ->
            def rel = "${pkg.replace('.', '/')}/${name}.class"
            !new File(outputDir, rel).exists()
        }
        assert missing.isEmpty() : "mixins.json references classes that were not compiled: ${missing}"
        println "Own mixin config checks passed: ${all.size()} entries, package=${pkg}"
    }
}

/**
 * JEI 版本判定名的防漂移校验。
 *
 * 背景：判定"这套 JEI 走哪条输入线"的同一个类名，出现在三个地方——
 *   - {@code client/JeiCapabilities}（运行期探测，唯一事实来源）；
 *   - {@code mixin/JERTMixinConfigPlugin}（mixin 变换期判定，故意零依赖、不复用上面的类）；
 *   - 本脚本（构建期从 jar 条目算 modernInput / transferService）。
 * 三者各有存在的理由，但**只要有一处改了名字而其余没跟上，症状是"某版本上功能静默失效"**，
 * 而且不会有任何异常——这是最难查的一类问题。所以在构建期强制三者一致。
 */
tasks.register('verifyCapabilityParity') {
    doLast {
        def decisive = [
            'mezz.jei.common.input.IInputTarget',
            'mezz.jei.common.transfer.RecipeTransferService'
        ]
        def holders = [
            'client': clientSource('JeiCapabilities.java'),
            'mixin' : file('src/main/java/com/slwold/jeirecipetree/mixin/JERTMixinConfigPlugin.java'),
            'build' : file('gradle/verify-jei.gradle')
        ]
        def problems = []
        holders.each { label, source ->
            assert source.exists() : "capability parity: missing ${source}"
            def text = source.getText('UTF-8')
            decisive.each { token ->
                if (!text.contains(token)) {
                    problems << "${label} (${source.name}) is missing ${token}".toString()
                }
            }
        }
        assert problems.isEmpty() : "capability tokens drifted apart: ${problems}"
        println "Capability parity passed: ${decisive.size()} decisive JEI class name(s) consistent across " +
            "${holders.keySet().join(' / ')}"
    }
}

tasks.register('verifyJeiCompatibility') {
    dependsOn 'classes'
    doLast {
        def jeiJar = configurations.jeiModel.files.find { it.name.startsWith('jei-') && it.name.endsWith('.jar') }
        assert jeiJar : "No JEI artifact in the jeiModel configuration (expected ${project.jei_version})"

        def entries = new java.util.zip.ZipFile(jeiJar).withCloseable { zip ->
            zip.entries().collect { it.name }.findAll { it.startsWith('mezz/jei/') && it.endsWith('.class') } as Set
        }
        def classBytes = { String internalName ->
            new java.util.zip.ZipFile(jeiJar).withCloseable { zip ->
                def entry = zip.getEntry(internalName + '.class')
                entry == null ? null : zip.getInputStream(entry).bytes
            }
        }

        // 版本择一生效的 mixin：与 JERTMixinConfigPlugin 的判定保持一致
        // 修正过的坑：entries 里全是 "xxx.class" 条目，早先少写了 .class 后缀，
        // 导致这两个标志恒为 false —— 于是本脚本永远按"旧版输入线"去挑 mixin 校验，
        // 实际在 19.54（transferService 存在）上跑的是另一套。标志错了不会报错，只会校验错对象。
        boolean modernInput = entries.contains('mezz/jei/common/input/IInputTarget.class')
        boolean transferService = entries.contains('mezz/jei/common/transfer/RecipeTransferService.class')
        def onlyLegacy = ['IngredientLookupStateLegacyMixin']
        def onlyService = ['IngredientLookupStateServiceMixin']
        def onlyModern = ['JeiInteractionTabsMixin', 'JeiInputSceneMixin', 'JeiRecipeNavigationMixin']
        def skipWhenModern = ['RecipesGuiMixin', 'RecipeGuiTabsMixin']

        int targets = 0, methodsChecked = 0, redirectsChecked = 0, skippedForeign = 0, skippedOptional = 0
        def sources = fileTree('src/main/java') { include '**/mixin/*.java' }
        assert !sources.isEmpty()

        sources.each { File source ->
            String text = source.getText('UTF-8')
            if (!text.contains('@Mixin')) return
            String simple = source.name - '.java'

            boolean applicable = !(simple in onlyLegacy && transferService) &&
                    !(simple in onlyService && !transferService) &&
                    !(simple in onlyModern && !modernInput) &&
                    !(simple in skipWhenModern && modernInput)
            if (!applicable) return

            // 目标类：imports 映射后解析 targets = "..." / targets = {"a","b"} / value = X.class 三种写法
            def imports = [:]
            (text =~ /(?m)^import\s+([\w.]+)\.([A-Za-z_]\w*);/).each { all, pkg, name -> imports[name] = pkg + '.' + name }
            def declared = [] as Set
            def mixinBlock = (text =~ /(?s)@Mixin\s*\((?:[^()]|\([^()]*\))*\)/)
            assert mixinBlock.find() : "${simple}: no @Mixin(...) found"
            String declaration = mixinBlock.group(0)
            (declaration =~ /"([\w.\$]+)"/).each { all, fqn ->
                if (fqn.contains('.')) declared << fqn
            }
            (declaration =~ /([A-Za-z_]\w*)\.class/).each { all, name ->
                declared << (imports[name] ?: name)
            }
            assert !declared.isEmpty() : "${simple}: cannot resolve @Mixin target"

            // 只校验 JEI 内部目标；AE2/RS/BeyondDimensions 等可选 mod 不在 jeiModel 里
            def jeiTargets = declared.findAll { it.startsWith('mezz.jei.') }
            skippedForeign += (declared.size() - jeiTargets.size())
            // 目标缺失可接受的情况：@Pseudo（显式允许），或多目标并列（旧/新包路径择一存在）
            boolean pseudo = text.contains('@Pseudo')
            boolean alternativeTargets = jeiTargets.size() > 1
            def presentTargets = []
            jeiTargets.each { fqn ->
                def internal = fqn.replace('.', '/')
                if (!entries.contains(internal + '.class')) {
                    if (pseudo || alternativeTargets) {
                        skippedOptional++
                        return
                    }
                    assert false : "JEI ${project.jei_version}: ${simple} targets missing class ${fqn}"
                }
                presentTargets << fqn
                targets++
            }

            // 目标全在 JEI 之外（原版 / AE2 / RS 等可选 mod）时不校验方法，只统计
            if (presentTargets.isEmpty()) return

            // @Redirect 的目标是字节码里的方法调用。描述符里的括号和跨行字符串拼接让
            // 括号配对不可靠，改成「取注解后的窗口 + 拼接其中所有字符串字面量」再匹配。
            int redirectIndex = text.indexOf('@Redirect')
            while (redirectIndex >= 0) {
                int windowEnd = Math.min(text.length(), redirectIndex + 600)
                String window = text.substring(redirectIndex, windowEnd)
                StringBuilder joined = new StringBuilder()
                (window =~ /"([^"]*)"/).each { all, literal -> joined.append(literal) }
                def call = (joined.toString() =~ /L(mezz\/jei\/[\w\/$]+);([\w$<>]+)\(/)
                if (call.find()) {
                    String owner = call.group(1)
                    String name = call.group(2)
                    assert entries.contains(owner + '.class') :
                            "JEI ${project.jei_version}: ${simple} redirects into missing class ${owner}"
                    def bytes = classBytes(owner)
                    assert bytes != null && new String(bytes, 'ISO-8859-1').contains(name) :
                            "JEI ${project.jei_version}: ${simple} redirects to missing member ${owner}.${name}"
                    redirectsChecked++
                }
                redirectIndex = text.indexOf('@Redirect', redirectIndex + 1)
            }

            // @Inject(method = "a" | {"a","b"}) 里的方法名必须在目标类的常量池里出现。
            // require = 0 表示「允许注入不到」，用于跨版本兼容，跳过。
            def injectMatcher = (text =~ /(?s)@Inject\s*\((?:[^()]|\([^()]*\))*\)/)
            while (injectMatcher.find()) {
                String block = injectMatcher.group(0)
                if (block.contains('require = 0') || block.contains('require=0')) continue
                def methodNames = [] as Set
                (block =~ /method\s*=\s*"([^"]+)"/).each { all, sig -> methodNames << sig }
                (block =~ /method\s*=\s*\{([^}]+)\}/).each { all, sigs ->
                    (sigs =~ /"([^"]+)"/).each { m, sig -> methodNames << sig }
                }
                methodNames.each { sig ->
                    String name = sig.contains('(') ? sig.substring(0, sig.indexOf('(')) : sig
                    if (name.isEmpty()) return
                    boolean found = presentTargets.any { fqn ->
                        def bytes = classBytes(fqn.replace('.', '/'))
                        bytes != null && new String(bytes, 'ISO-8859-1').contains(name)
                    }
                    assert found : "JEI ${project.jei_version}: ${simple} injects missing method ${name}"
                    methodsChecked++
                }
            }
        }

        assert targets > 0 && methodsChecked > 0
        logger.lifecycle("JEI ${project.jei_version}: ${targets} target classes, ${methodsChecked} injected methods and ${redirectsChecked} redirects verified " +
                "(modernInput=${modernInput}, transferService=${transferService}, " +
                "foreign targets skipped=${skippedForeign}, optional @Pseudo targets absent=${skippedOptional})")
    }
}

/** 去掉 Java 源码里的行注释与块注释，只留代码——机检扫"是否真的用了这个特性"时用。 */
static String stripComments(String source) {
    def out = new StringBuilder()
    int i = 0
    int n = source.length()
    boolean inBlock = false
    boolean inString = false
    boolean inChar = false
    while (i < n) {
        char c = source.charAt(i)
        if (inBlock) {
            if (c == '*' && i + 1 < n && source.charAt(i + 1) == '/') {
                inBlock = false
                i += 2
                continue
            }
            i++
            continue
        }
        if (inString || inChar) {
            out.append(c)
            if (c == '\\' && i + 1 < n) {
                out.append(source.charAt(i + 1))
                i += 2
                continue
            }
            if ((inString && c == '"') || (inChar && c == '\'')) {
                inString = false
                inChar = false
            }
            i++
            continue
        }
        if (c == '/' && i + 1 < n && source.charAt(i + 1) == '/') {
            while (i < n && source.charAt(i) != '\n') {
                i++
            }
            continue
        }
        if (c == '/' && i + 1 < n && source.charAt(i + 1) == '*') {
            inBlock = true
            i += 2
            continue
        }
        if (c == '"') {
            inString = true
            out.append(c)
            i++
            continue
        }
        if (c == '\'') {
            inChar = true
            out.append(c)
            i++
            continue
        }
        out.append(c)
        i++
    }
    return out.toString()
}
